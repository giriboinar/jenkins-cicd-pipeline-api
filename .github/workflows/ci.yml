name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest==9.0.3 httpx==0.28.1
      - name: Run tests
        run: python -m pytest tests/ -q

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Jenkinsfile structure
        run: python3 scripts/check-jenkinsfile.py
      - name: Validate Kubernetes manifests
        run: |
          python3 -m pip install pyyaml==6.0.2
          python3 - <<'PY'
          import glob, yaml
          files = sorted(glob.glob('k8s/*.yaml') + glob.glob('monitoring/*.yml')
                         + glob.glob('docker-compose.yml') + glob.glob('jenkins/docker-compose.yml'))
          assert files, "no manifests found"
          for f in files:
              docs = [d for d in yaml.safe_load_all(open(f)) if d]
              assert docs, f"empty manifest: {f}"
              print(f"{f}: {len(docs)} document(s) OK")
          PY

  docker:
    runs-on: ubuntu-latest
    needs: [test, security]
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: deployment-tracker-api:ci
