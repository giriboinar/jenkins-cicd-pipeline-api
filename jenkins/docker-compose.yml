# Local Jenkins controller only. The Docker socket mount lets Jenkins build
# images on the host - acceptable for a local demo, NOT for a shared Jenkins
# server (any job could then use the host Docker daemon).
services:
  jenkins:
    image: jenkins/jenkins:2.462.3-lts-jdk17
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
volumes:
  jenkins_home:
